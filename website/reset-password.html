<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | PharmaSOFT</title>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --surface: #1e293b;
            --bg: #0f172a;
            --muted: #94a3b8;
            --text: #f8fafc;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Inter, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #1e293b 100%);
            color: var(--text);
            padding: 1.5rem;
        }

        .card {
            width: min(100%, 28rem);
            background: rgba(30, 41, 59, 0.92);
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 18px 60px rgba(15, 23, 42, 0.45);
        }

        h1 {
            margin: 0 0 0.75rem;
            font-size: 1.9rem;
        }

        p {
            color: var(--muted);
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 1rem 0 0.5rem;
            font-size: 0.95rem;
            color: var(--muted);
        }

        input {
            width: 100%;
            padding: 0.85rem 1rem;
            border-radius: 0.75rem;
            border: 1px solid rgba(148, 163, 184, 0.2);
            background: rgba(51, 65, 85, 0.85);
            color: var(--text);
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            width: 100%;
            margin-top: 1.5rem;
            padding: 0.9rem 1rem;
            border: none;
            border-radius: 0.75rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 1rem;
            padding: 0.9rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.95rem;
        }

        .message.error {
            display: block;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fecaca;
        }

        .message.success {
            display: block;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #bbf7d0;
        }

        a {
            color: #6ee7b7;
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>Reset your password</h1>
        <p id="intro-text">Validating your secure reset link...</p>
        <form id="reset-form" style="display: none;">
            <label for="new-password">New password</label>
            <input type="password" id="new-password" minlength="8" placeholder="At least 8 characters" required>

            <label for="confirm-password">Confirm password</label>
            <input type="password" id="confirm-password" minlength="8" placeholder="Repeat your password" required>

            <button type="submit" id="reset-button">Update password</button>
        </form>
        <div id="message" class="message"></div>
        <p style="margin-top: 1.5rem;"><a href=BASE_PATH + '/index.html'>Back to homepage</a></p>
    </main>

    <script>
        // Base path resolution for subfolder hosting (e.g. /pharmasoft/)
  const BASE_PATH = window.location.pathname.startsWith('/pharmasoft') ? '/pharmasoft' : '';
  const API_URL = BASE_PATH + '/api';
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const introText = document.getElementById('intro-text');
        const messageBox = document.getElementById('message');
        const form = document.getElementById('reset-form');
        const button = document.getElementById('reset-button');

        function setMessage(type, text) {
            messageBox.className = `message ${type}`;
            messageBox.textContent = text;
        }

        async function validateToken() {
            if (!token) {
                setMessage('error', 'This reset link is missing a token. Please generate a new one.');
                introText.textContent = 'Password reset unavailable.';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth/reset-password/validate?token=${encodeURIComponent(token)}`);
                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.error?.message || data.error || 'This reset link is invalid or expired.');
                }

                introText.textContent = `Set a new password for ${data.data.username}.`;
                form.style.display = 'block';
            } catch (error) {
                setMessage('error', error.message);
                introText.textContent = 'Password reset unavailable.';
            }
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const password = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (password !== confirmPassword) {
                setMessage('error', 'Passwords do not match.');
                return;
            }

            button.disabled = true;
            button.textContent = 'Updating...';
            messageBox.className = 'message';
            messageBox.textContent = '';

            try {
                const response = await fetch(`${API_URL}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });
                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.error?.message || data.error || 'Password reset failed.');
                }

                form.reset();
                form.style.display = 'none';
                introText.textContent = 'Your password has been updated.';
                setMessage('success', 'Password updated successfully. You can now log in from the homepage.');
            } catch (error) {
                setMessage('error', error.message);
            } finally {
                button.disabled = false;
                button.textContent = 'Update password';
            }
        });

        validateToken();
    </script>
</body>

</html>
